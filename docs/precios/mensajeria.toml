# Catalogo de precios de MENSAJERIA por pais y tipo de mensaje (RF-16).
#
# Lo carga `app.tenancy.budget.cargar_precios` en la tabla `precios_por_pais`.
# La aplicacion solo LEE esa tabla; escribirla es un acto del operador con el rol
# migrador.
#
# ==QUE SON ESTAS CIFRAS, dicho sin adornos: son COTAS SUPERIORES declaradas por
# la casa, NO la tarifa publicada de la plataforma.== No estan contrastadas
# contra la fuente primaria — el eje 3 de T-004*pre ("¿siguen vigentes cupos,
# escalones y precios por pais?") sigue abierto — y por eso este archivo declara
# `verificado = false` y su `fuente` lo dice tambien, para que el hecho viaje con
# cada fila hasta la base y hasta cualquier importe que salga de ella.
#
# Por que una cota superior y no un hueco: RF-16 dice que el techo "nunca deja de
# contar por no tener el dato, porque es ruta de dinero". Sobrecontar corta antes
# de tiempo y cuesta una conversacion; subcontar deja pasar gasto por encima del
# techo y cuesta dinero real, que es lo que RF-16 existe para impedir. Un cero o
# un hueco es subcontar.
#
# `servicio` se tarifa como `utilidad` A PROPOSITO. No afirmamos que el mensaje
# de servicio sea gratis: afirmamos que no creemos que cueste mas que una
# utilidad. Un cero aqui seria una afirmacion sobre la plataforma que nadie ha
# medido, y ademas en la direccion cara.
#
# La tarificacion por CONVERSACION esta deprecada desde el 1-jul-2025: hoy es por
# mensaje/plantilla (T-004*pre). Por eso la llave es (pais, tipo) y no una
# duracion.
#
# COMO SE SUSTITUYE: el operador descarga la tabla publicada por la plataforma,
# la escribe aqui con su `fuente` y su `fecha` reales, pone `verificado = true` y
# la carga. Mientras no ocurra, lo que protege el dinero es doble: la caducidad a
# 30 dias (`cargada_en`) y el respaldo al precio mas alto conocido.

