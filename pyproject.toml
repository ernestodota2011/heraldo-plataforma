[project]
name = "heraldo"
version = "0.0.0"
description = "Heraldo — plataforma multi-inquilino de agentes de IA en marca blanca"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# WHY: el repositorio es publico, pero el software no es libre. Sin esta
# declaracion la licencia solo la ve quien abra LICENSE, y la herramienta que
# empaqueta no la ve nunca. `Private :: Do Not Upload` no es decorativo: PyPI
# RECHAZA un paquete que lo lleve, asi que una subida por accidente falla
# en vez de publicar la plataforma de la agencia.
classifiers = [
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
]
dependencies = [
    "heraldo-api",
    "heraldo-worker",
    # WHY: `deploy/proteger_rama.py` deriva de `ci.yml` los nombres de las
    # comprobaciones que la rama exigira. La primera version leia ese YAML con
    # expresiones regulares y lo levanto Crisol: `name: Suite  # comentario`
    # daba el contexto `"Suite  # comentario"` (verificado por efecto). Un
    # contexto que GitHub no reporta nunca deja la regla esperando para siempre
    # — el mecanismo cayendo justo en el fallo mudo que existe para evitar.
    # Va en las dependencias del proyecto y no en el grupo `dev` a proposito:
    # los guiones de `deploy/` corren en un despliegue, donde `dev` puede no
    # estar. Declararlo solo para las pruebas seria P-38 con otro traje.
    "pyyaml>=6",
]

# El workspace de uv es el empaquetado de la casa: los servicios vivos corren
# `uv run pytest`. `packages/egress` entra aqui como miembro de PRIMER NIVEL.
[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/egress"]

[tool.uv.sources]
heraldo-api = { workspace = true }
heraldo-worker = { workspace = true }
heraldo-egress = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    # >=1.4 NO es cosmetico: `conftest.py` implementa el hook
    # `pytest_asyncio_loop_factories`, que NO existe en 1.3.0 (medido). pytest
    # ABORTA la coleccion entera ante un hook `pytest_*` que ningun hookspec
    # declara (`PluginValidationError: unknown hook`), asi que un piso mas bajo
    # permite resolver una version donde la suite no arranca. Ver P-09.
    "pytest-asyncio>=1.4",
    "ruff>=0.14",
    # Cliente HTTP asincrono con transporte ASGI: la suite golpea la aplicacion
    # REAL —con su middleware de CORS ya montado— sin levantar ningun servidor.
    # Es lo que permite medir RF-30 por EFECTO (la cabecera que de verdad sale)
    # en vez de releyendo la configuracion que acabamos de escribir.
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/web"]

[tool.ruff.lint]
# S = flake8-bandit. El producto existe para no repetir un SSRF: el linter
# tambien vigila, no solo el guard.
select = ["E", "F", "I", "B", "UP", "S"]

# Sin esto, isort trata `app`/`egress` como paquetes de terceros y reordena los
# imports del propio producto por debajo de las dependencias.
[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "egress",
    "worker",
    "conftest",
    "test_rls_cobertura",
    "test_escalada_alcance",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert es el vocabulario de la suite

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-q --strict-markers"
# La aplicacion es asincrona (la API no puede bloquear el bucle de eventos), asi
# que la suite que la mide tambien lo es. `auto` evita que un test asincrono sin
# marca se "pase" en verde sin haberse ejecutado nunca.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
